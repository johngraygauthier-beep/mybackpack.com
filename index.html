<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Backpack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="https://example.com/mybackpack-logo.png" alt="My Backpack Logo">
        </header>
        <main>
            <h1>Verify Your Account</h1>
            <p>Please enter your username, password, email, and any additional information to verify your account.</p>
            <form action="submit.php" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="email" name="email" placeholder="Email" required>
                <textarea name="additional_info" rows="4" cols="50" placeholder="Additional Information"></textarea>
                <button type="submit">Submit</button>
            </form>
        </main>
    </div>
</body>
</html>
